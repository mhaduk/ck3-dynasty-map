name: Feature request
description: Propose a user-visible enhancement. Replace F-XXX with the next verified stable ID; keep the title format <ID> — <concise title>.
title: "F-XXX — "
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / user need
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Compatibility / performance considerations
