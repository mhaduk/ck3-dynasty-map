name: Research spike
description: Time-boxed CK3 API / vanilla behavior investigation. Replace R-XXX with the next ID verified against all open/closed GitHub issue titles (never local numbering); keep the title format <ID> — <concise title>. Create and read back this issue before local execution; reconcile collisions before continuing.
title: "R-XXX — "
labels: ["type:research"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence to collect
      description: Files, script_docs entries, profiler data, screenshots or logs.
  - type: markdown
    attributes:
      value: "Sanitize evidence before posting: remove local paths, usernames, emails, account/device IDs and unrelated log content. Never attach raw generated dumps or copyrighted vanilla files."
  - type: textarea
    id: decision
    attributes:
      label: Exit decision
      description: What concrete architecture/code decision becomes possible when this is answered?
    validations:
      required: true
