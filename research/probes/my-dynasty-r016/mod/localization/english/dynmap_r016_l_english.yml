l_english:
 dynmap_r016_dynasty_tt:0 "Dynasty — Open Dynasty Realms and recompute for your current Dynasty. Manual refresh only."
 dynmap_r016_back:0 "Return to the native map view"
 dynmap_r016_realms:0 "Dynasty Realms"
 dynmap_r016_realms_tt:0 "#T Dynasty Realms#!\nShows your Dynasty’s realms and its holdings within other realms.\n\n#bold Dark:#! Realms whose independent ruler belongs to your Dynasty.\n#bold Light:#! Holdings whose holder or any liege belongs to your Dynasty, but whose independent ruler does not.\n#bold Grey:#! Counties outside your Dynasty’s control.\n\nThe independent ruler is the highest ruler in the liege hierarchy, with no liege above them."
 dynmap_r016_holdings:0 "Dynasty Holdings"
 dynmap_r016_holdings_tt:0 "#T Dynasty Holdings#!\nShows counties held by your Dynasty and its vassals, regardless of the independent ruler’s Dynasty.\n\n#bold Dark:#! Counties held by members of your Dynasty.\n#bold Light:#! Counties held by other rulers with a member of your Dynasty anywhere above them in the liege hierarchy.\n#bold Grey:#! Counties outside your Dynasty’s control.\n\nThe independent ruler is the highest ruler in the liege hierarchy. They may belong to another Dynasty without changing these colors."
 dynmap_r016_my_realm:0 "My Realm & Dynasty"
 dynmap_r016_my_realm_tt:0 "#T My Realm & Dynasty#!\nShows your realm and your Dynasty’s holdings beyond its borders, even when you serve an independent ruler from another Dynasty.\n\n#bold Dark:#! Counties held by you or any of your vassals. Your liege’s other lands are not included.\n#bold Light:#! Counties outside your realm whose holder or any liege belongs to your Dynasty, regardless of the independent ruler’s Dynasty.\n#bold Grey:#! Counties outside your realm and your Dynasty’s control.\n\nThe independent ruler is the highest ruler in the liege hierarchy. Serving them does not make their entire realm part of yours."

 dynmap_my_dynasty:0 "Dynasty Realms"
 dynmap_my_dynasty_desc:0 "Highest-ruler Dynasty, then any dynastic holder or senior."
 dynmap_dynasty_holdings:0 "Dynasty Holdings"
 dynmap_dynasty_holdings_desc:0 "County-holder Dynasty, then any dynastic senior."
 dynmap_my_realm_dynasty:0 "My Realm & Dynasty"
 dynmap_my_realm_dynasty_desc:0 "Your own de-facto subtree, then other dynastically controlled counties."
